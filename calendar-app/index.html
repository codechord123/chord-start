<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="선생님 캘린더">
  <title>선생님 공유 캘린더</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── 최초 설정 화면 ── -->
<div id="setup-screen">
  <div class="setup-card">
    <h2>📅 선생님 캘린더</h2>
    <p>선생님들이 함께 사용하는 공유 캘린더입니다.<br>이름과 색상을 선택해 주세요.</p>
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="setup-name" placeholder="예: 김선생님" maxlength="20">
    </div>
    <div class="form-group">
      <label>내 색상</label>
      <div class="color-picker" id="setup-color-picker"></div>
    </div>
    <button class="save-btn" id="setup-save-btn" style="width:100%;margin-top:8px">시작하기</button>
  </div>
</div>

<!-- ── 메인 앱 ── -->
<div id="app" style="display:flex;flex-direction:column;height:100dvh">

  <!-- 헤더 -->
  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn" id="sidebar-toggle" title="선생님 목록">☰</button>
      <h1>📅 선생님 캘린더</h1>
    </div>
    <div class="header-center">
      <button class="nav-btn" id="prev-month">&#8249;</button>
      <h2 id="month-label">2024년 1월</h2>
      <button class="nav-btn" id="next-month">&#8250;</button>
    </div>
    <div class="header-right">
      <button class="today-btn" id="today-btn">오늘</button>
      <button class="icon-btn" id="my-info-btn" title="내 정보 수정">👤</button>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <div class="main-layout" style="flex:1;overflow:hidden">

    <!-- 사이드바 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <h3>선생님 목록</h3>
        <div id="teacher-list"></div>
      </div>
      <div id="firebase-warning" class="setup-banner" style="display:none">
        <strong>⚠️ Firebase 미설정</strong>
        firebase-config.js 파일에 Firebase 설정을 입력하면 실시간 공유가 활성화됩니다.
      </div>
    </aside>

    <!-- 캘린더 -->
    <main class="calendar-container">
      <div class="week-headers">
        <div class="week-header sun">일</div>
        <div class="week-header">월</div>
        <div class="week-header">화</div>
        <div class="week-header">수</div>
        <div class="week-header">목</div>
        <div class="week-header">금</div>
        <div class="week-header sat">토</div>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </main>

  </div>
</div>

<!-- ── 일정 모달 ── -->
<div class="modal-overlay hidden" id="modal-overlay"></div>

<div class="modal hidden" id="event-modal">
  <div class="modal-header">
    <h3 id="event-modal-title">일정 추가</h3>
    <button class="close-btn" id="close-event-modal">✕</button>
  </div>
  <form id="event-form">
    <div class="form-group">
      <label>제목 *</label>
      <input type="text" id="ef-title" placeholder="일정 제목" required maxlength="60">
    </div>
    <div class="form-group">
      <label>날짜 *</label>
      <input type="date" id="ef-date" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>시작 시간</label>
        <input type="time" id="ef-start">
      </div>
      <div class="form-group">
        <label>종료 시간</label>
        <input type="time" id="ef-end">
      </div>
    </div>
    <div class="form-group">
      <label>내용</label>
      <textarea id="ef-desc" placeholder="내용 (선택사항)"></textarea>
    </div>
    <div class="form-group">
      <label>작성 선생님</label>
      <select id="ef-teacher"></select>
    </div>
    <div class="form-actions">
      <button type="button" class="delete-btn hidden" id="ef-delete">삭제</button>
      <button type="submit" class="save-btn">저장</button>
    </div>
  </form>
</div>

<!-- ── 내 정보 수정 모달 ── -->
<div class="modal hidden" id="my-info-modal">
  <div class="modal-header">
    <h3>내 정보 수정</h3>
    <button class="close-btn" id="close-my-info-modal">✕</button>
  </div>
  <div class="form-group">
    <label>이름</label>
    <input type="text" id="mi-name" maxlength="20">
  </div>
  <div class="form-group">
    <label>내 색상</label>
    <div class="color-picker" id="mi-color-picker"></div>
  </div>
  <div class="form-actions">
    <button class="save-btn" id="mi-save-btn">저장</button>
  </div>
</div>

<!-- 토스트 알림 -->
<div class="toast" id="toast"></div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
